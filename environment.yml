# Conda environment for Streamlit Community Cloud.
#
# Purpose: pin Python 3.12 (the one repo-side mechanism Streamlit Cloud honors —
# its default of 3.14 has no wheels for these deps) AND keep one consistent ABI by
# installing everything from conda-forge (mixing pip-built C-extensions into a
# conda env segfaulted at runtime).
#
# Solve speed: use ONLY conda-forge (no slow/ToS `defaults` channel) and pin to
# major.minor (not exact patch) so conda's classic solver resolves in seconds
# instead of stalling. Minor versions still match the tested stack; numpy/pyarrow
# come in as compatible conda-forge dependencies.
name: netflix-analytics
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pandas=2.2.*
  - scikit-learn=1.5.*
  - plotly=5.24.*
  - streamlit=1.39.*
